# Music Wrapped — filter and analysis configuration
timezone_offset_hours: 8        # AWST; export timestamps are UTC

# Artists removed outright (exact match on the artist portion of Track Description)
blocked_artists:
  - "UCB 2"                     # Radio station on the HomePod — not my listening

# Sleep-music detection: an artist is classed as sleep/ambient when ALL thresholds are met
sleep_filter:
  enabled: true
  min_plays: 20                 # ignore artists below this (too little signal)
  night_share: 0.80             # fraction of plays between night_start and night_end (local)
  homepod_share: 0.80           # fraction of plays sourced from HomePod
  night_start: 20               # 8pm local
  night_end: 6                  # 6am local
  # Safety net: keyword match forces sleep classification regardless of thresholds
  keywords: [sleep, noise, ambient, calm, dream, solfeggio, "hz", lullaby, rain, meditation]

# Focus/ambient music played during the day (work): generative artists show a
# distinctive signature — heavy repeats of few tracks, never skipped. Below
# min_plays the same signature matches Christmas music, so the threshold stays
# at 40; smaller residuals are caught by genre enrichment.
focus_filter:
  enabled: true
  min_plays: 40
  max_skip_rate: 0.03
  min_plays_per_track: 4

# After genre enrichment (enrich.py), these genres are also excluded
excluded_genres: [Sleep, "New Age", Ambient, "Healthcare & Fitness"]

report:
  top_n: 20
  years: all

# Christmas music: tagged at track level (title keywords, or >=70% of a
# track's plays in Nov-Dec with >=8 plays). Post-enrichment, iTunes genre
# "Holiday" is authoritative. Modes: include | exclude | separate
christmas_filter:
  mode: separate
  keywords: [christmas, santa, jingle, sleigh, noel, navidad, mistletoe,
             snowman, rudolph, "silent night", "winter wonderland", december]
  seasonal_share: 0.70
  min_plays: 8

# Phase C: playlist generation (src/create_playlists.py). Each profile's
# seed_artists come from output/taste_profiles.md — edit here (not in code)
# to tune a playlist without touching the script. candidates_per_playlist
# is the target list length (spine + discovery); spine_target caps how many
# proven-favourite tracks lead each playlist before discovery candidates
# fill the rest. Personal Effects and the likely_ambient_residual artists
# from taste_profile.json are excluded from every profile's discovery pool
# automatically, not listed as seeds anywhere below.
taste_playlists:
  # 300 candidates targets ~100+ actual playlist adds at the observed
  # 46-61% local-library match rate, with margin since deeper/more obscure
  # discovery picks tend to match less often than proven favourites.
  candidates_per_playlist: 300
  spine_target: 40
  max_tracks_per_seed_artist: 10
  profiles:
    - name: "Fingerstyle Acoustic Folk"
      seed_artists: [Charlie Cunningham, Nick Mulvey, Roo Panes, José González,
                      The Franklin Electric, "#1 Dads", Jack Savoretti,
                      Hollow Coves, Sons Of The East]
    - name: "Anthemic Brit-Alt"
      seed_artists: [Coldplay, Keane, Snow Patrol, Bastille, The Verve, Kodaline,
                      The Script, Feeder, You Me At Six, Kaiser Chiefs, James Bay,
                      Mumford & Sons, Gerry Cinnamon, Oasis, Ocean Colour Scene]
    - name: "Aussie Singer-Songwriter"
      seed_artists: [The Rubens, Vance Joy, Harrison Storm, Amy Shark, Illy,
                      Gang of Youths, Dean Lewis, Birds of Tokyo]
    - name: "Classic and Legacy Rock-Pop"
      seed_artists: [Fleetwood Mac, Elton John, Matchbox Twenty, Madonna, ABBA,
                      Kate Bush, Green Day]
    - name: "2010s Mainstream Pop"
      seed_artists: [The Weeknd, The Chainsmokers, Kygo, Ariana Grande,
                      Taylor Swift, Dua Lipa, Calvin Harris, Avicii, Katy Perry,
                      Sia, Justin Bieber, Shawn Mendes]
    - name: "Atmospheric Synth-Pop"
      seed_artists: [The Neighbourhood, Glass Animals, Future Islands,
                      Empire Of The Sun, Foster the People, Young the Giant,
                      Milky Chance, St. Lucia, Years & Years, The Temper Trap,
                      Capital Cities, The 1975]
